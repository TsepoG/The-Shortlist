[project]
name = "shortlist"
version = "0.1.0"
description = "A sector fundamental screener and historical backtester."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config --cov=shortlist --cov-report=term-missing"
markers = [
    "integration: requires a real Postgres database (DATABASE_URL); skipped locally if unreachable, required to pass in CI",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "ANN202"]
"alembic/**" = ["ANN001", "ANN201", "ANN202", "I001"]

[tool.coverage.run]
source = ["shortlist"]
omit = ["src/shortlist/ingest/scripts/*"]

[tool.coverage.report]
show_missing = true
