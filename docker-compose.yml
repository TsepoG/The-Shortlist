# Local Postgres, deliberately identical to the service block in
# .github/workflows/ci.yml (image, credentials, db name) so DATABASE_URL differs
# from CI only in host port. Published on 5433, not 5432: this machine already
# runs a native Postgres service on 5432, and remapping the container's host
# port is far less invasive than touching a pre-existing service unrelated to
# this project. CI has no such conflict and uses 5432 directly.
#
# Credentials come from .env (Docker Compose reads a .env file in this same
# directory automatically, with no extra config) — copy .env.example to .env
# first. See CLAUDE.md's Commands section.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - shortlist_pg_data:/var/lib/postgresql/data

volumes:
  shortlist_pg_data:
